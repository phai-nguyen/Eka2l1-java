            'V20 RESCHED BEGIN:'
            'V20 RESCHED END:'
            'V19 DYNCOM ATOMICSTOP:'
            'V18 MMF95 EVTSEND:'
            'V18 MSGQ40 ARM:'
            'V18 MSGQ40 WAKE-BEFORE:'
            'V18 MSGQ40 WAKE-AFTER:'
            'V18 MSGQ40 RECV:'
            'V17 MSGQ ORDER:'
            'V16 MMF95 QRETRY:'
            'V15 DSP RETRY:'
            'V15 MMF95 RETRY:'
            'V14 DSP REFILL:'
            'V14 MMF95 STREAMINIT:'
            'V14 MMF95 FORMAT:'
            'V14 MMF95 CONFIGBUF:'
            'V14 MMF95 GETBUF:'
            'V14 MMF95 PLAYDATA:'
            'V13 MMF95 PRIORITYABI:'
            'V13 MMF95 CONFIG:'
            'V13 MMF95 ABI112:'
            'V13 MMF95 PLAYINIT:'
            'V12 MMF95 PRIORITY: opcode=45 dispatch'
            'V11 AKNICON95 RASTER:'
            'V11 CONTENTDIM PRECOMPLETE:'
            'V11 CONTENTDIM POSTCOMPLETE:'
            'V11 FBS95 FONT: layout=v2'
            'V11 LEAVE5:'
            'V10 AKNICON95 CONTENTDIM:'
            'V10 IPCERR:'
            'V9 FBS95 CREATE:'
            'V8 IPCCTX:'
            'V8 ALF95:'
            'V8 ALF95 COMPAT:'
            'V8 ALF95 IPCMISS:'
            'V7 AKNICON95:'
            'V7 OPENVG95 COVERAGE:'
            'V6 OPENVG95:'
            'V5 SVC95:'
            'V5 SVCMISS:'
            'V5 CODEDUMP: reentrancy guard enabled'
            'V3 EPOC95:'
            'V3 ROMBSS:'
          )
          for marker in "${markers[@]}"; do
            if grep -Fq "$marker" "$STRINGS_OUT"; then
              echo "PASS: $marker"
            else
              echo "ERROR: missing binary marker: $marker" >&2
              exit 1
            fi
          done
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_24.py"
          echo 'V23 Vietnamese UI binary markers + V9-V23 preservation: PASS'

      - name: Verify J2ME R1 phoneME binary and SUPPORT1 isolation
        working-directory: upstream
        run: |
          set -euo pipefail
          APP="build-ios-device/src/emu/ios/eka2l1.app"
          BIN="$APP/eka2l1"
          ROOT="src/emu/ios/app/RootViewController.mm"
          CODESEG="src/emu/kernel/src/codeseg.cpp"
          test -x "$BIN"
          test -s third_party/phoneme-r1/lib/libphoneMECore.a

          # BUILDFIX4 VERIFYPIPEFIX1: do not pipe Apple's `strings` into
          # `grep -q` while `set -o pipefail` is active. Once grep finds a
          # marker it closes the pipe early; Xcode 26 `strings` can then fail
          # with "failed to flush output" even though the marker was present.
          # Dump once, then search the completed file.
          J2ME_STRINGS="$RUNNER_TEMP/eka2l1-j2me-r1-binary.strings"
          strings "$BIN" > "$J2ME_STRINGS"
          grep -Fq 'Java J2ME' "$J2ME_STRINGS"
          grep -Fq 'phoneME C ABI major mismatch' "$J2ME_STRINGS"
          grep -Fq 'MIDlet-1 is missing or invalid' "$J2ME_STRINGS"
          grep -Fq 'phoneme_configure_jit(g_runtime, 0)' src/emu/ios/app/j2me/J2MEBridge.mm
          grep -Fq 'scale_percent = std::clamp(scale_percent, 10, 300)' src/emu/ios/app/j2me/J2MEProfile.hpp
          grep -Fq 'NGAGE CLASSIC R2FX2 R2 CRASHFIX1:' "$ROOT"
          grep -Fq 'com.eka2l1.ngage.lifecycle' "$ROOT"
          grep -Fq 'NGAGE CLASSIC R2FX2 COMPATIBILITY R2 EXPORTMAP BATCH1:' "$CODESEG"
          grep -Fq 'unresolved NEW guest ordinal=' "$CODESEG"
          ! grep -Fq 'ord == 61' "$CODESEG"
          ! grep -Fq 'ord == 63' "$CODESEG"
          echo 'J2ME R1 binary markers + SUPPORT1 isolation: PASS'

      - name: Package unsigned IPA
        working-directory: upstream
        run: |
          set -euo pipefail
          APP="build-ios-device/src/emu/ios/eka2l1.app"
          IPA="EKA2L1-iOS-JAVA-R1-PHONEME-SUPPORT1-LIBUVFIX1-BUILDFIX5-unsigned.ipa"
          STAGE="ipa-stage"

          test -d "$APP"
          test -x "$APP/eka2l1"
          rm -rf "$STAGE" "$IPA"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/EKA2L1.app"

          # Keep this artifact unsigned so the user can sign/install it with
          # their preferred iOS signing method. Remove any stale signature or
          # provisioning data inherited from the build tree.
          rm -rf "$STAGE/Payload/EKA2L1.app/_CodeSignature"
          rm -f "$STAGE/Payload/EKA2L1.app/embedded.mobileprovision"

          (cd "$STAGE" && /usr/bin/zip -qry "../$IPA" Payload)
          /usr/bin/unzip -t "$IPA" >/dev/null
          /usr/bin/unzip -l "$IPA" | grep -Fq 'Payload/EKA2L1.app/eka2l1'
          test -s "$IPA"
          echo 'Unsigned IPA package: PASS'
          ls -lh "$IPA"
          shasum -a 256 "$IPA"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EKA2L1-iOS-JAVA-R1-PHONEME-SUPPORT1-LIBUVFIX1-BUILDFIX5-IPA
          path: upstream/EKA2L1-iOS-JAVA-R1-PHONEME-SUPPORT1-LIBUVFIX1-BUILDFIX5-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EKA2L1-JAVA-R1-PHONEME-SUPPORT1-LIBUVFIX1-build-log
          path: eka2l1-java-build.log
          if-no-files-found: ignore
          retention-days: 14
