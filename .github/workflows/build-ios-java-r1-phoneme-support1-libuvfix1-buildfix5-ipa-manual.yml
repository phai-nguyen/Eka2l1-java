          @class PMMediaEntry;
          
          static void PMReevaluateNowPlaying(PMMediaEntry *preferredEntry);
          static void PMClearNowPlaying(void);
          
          static uint8_t gPMMediaQueueSpecificKey;
          
          static dispatch_queue_t PMMediaQueue(void) {
