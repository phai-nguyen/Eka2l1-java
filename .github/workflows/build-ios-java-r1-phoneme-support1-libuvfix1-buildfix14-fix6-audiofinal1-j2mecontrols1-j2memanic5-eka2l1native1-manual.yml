          grep -Fq 'manic4KeyMapping' "$PLAYER"
          grep -Fq 'manic4GeometryLayout' "$PLAYER"
          grep -Fq 'j2meManicSanitizedGeometry' "$PLAYER"
          grep -Fq 'j2meManicApplySharedMapping' "$PLAYER"
          ! grep -Fq '_settings[[self j2meManicLayoutKey]]=layout' "$PLAYER"

          # All direction sources terminate at one final refcount arbiter.
          grep -Fq '_manicDirectionRefCounts' "$PLAYER"
          grep -Fq 'j2meManicRouteScancode' "$PLAYER"
          grep -Fq '_controls.keyOutput=^(int32_t code,BOOL down)' "$PLAYER"
          grep -Fq '_manicDirectional.directionOutput=^(int32_t code,BOOL down)' "$PLAYER"

          # Pressed visuals use physical control identity, never the mapped key code.
          grep -Fq 'controlVisualOutput)(NSString *controlID, BOOL down)' "$GCV_H"
          grep -Fq 'controlID:(el[@"asset"] ?: el[@"label"])' "$GCV"
          grep -Fq 'emitControlVisualForIndex' "$GCV"
          grep -Fq 'setControlIdentifier:(NSString *)controlID down:(BOOL)down' "$MANIC_H"
          grep -Fq 'activeControlIDs' "$MANIC_M"

          # Editor pan is converted in the representation mapping-space.
          grep -Fq 'd.x/(mapW*fit)' "$GCV"
          grep -Fq 'd.y/(mapH*fit)' "$GCV"

