          def replace_once(text, old, new, label):
              c = text.count(old)
              if c != 1:
                  raise SystemExit(f'BUILDFIX7 {label}: expected exactly one anchor, found {c}')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, repl, label, flags=0):
              new, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'BUILDFIX7 {label}: expected exactly one regex anchor, found {n}')
              return new

          def method_bounds(text, signature):
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f'BUILDFIX7 method missing: {signature}')
              brace = text.find('{', start)
              if brace < 0:
                  raise SystemExit(f'BUILDFIX7 method has no body: {signature}')
              depth = 0
              i = brace
              in_str = False
              esc = False
              while i < len(text):
                  ch = text[i]
                  if in_str:
                      if esc: esc = False
                      elif ch == '\\': esc = True
                      elif ch == '"': in_str = False
                  else:
                      if ch == '"': in_str = True
                      elif ch == '{': depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return start, i + 1
                  i += 1
              raise SystemExit(f'BUILDFIX7 unterminated method: {signature}')

          def patch_method(text, signature, fn):
              a,b = method_bounds(text, signature)
              old = text[a:b]
              new = fn(old)
              if new == old:
                  raise SystemExit(f'BUILDFIX7 method patch made no change: {signature}')
              return text[:a] + new + text[b:]

          # ---------------------------------------------------------------------------
          # RootViewController integration
          # ---------------------------------------------------------------------------
          r = root.read_text(encoding='utf-8')

          import_anchor = '#import "j2me/J2MELibraryViewController.h"\n'
          imports = ('#import "j2me/EKAUnifiedLibraryViewController.h"\n'
                     '#import "EKAFirmwareGateViewController.h"\n')
          if imports not in r:
              r = replace_once(r, import_anchor, import_anchor + imports, 'Root imports')

          prop_anchor = '@property (nonatomic, strong) NSMutableArray<NSString *> *pendingImportedFiles;\n'
          props = ('@property (nonatomic, strong) EKAUnifiedLibraryViewController *unifiedLibrary;\n'
                   '@property (nonatomic, copy) NSString *pendingInstallAfterFirmware;\n')
          if props not in r:
              r = replace_once(r, prop_anchor, prop_anchor + props, 'Root properties')

          # Remove the fifth Java toolbar button added by the old J2ME installer/UIENTRYFIX1.
          java_block_pattern = r'''\n    UIButton \*javaButton = \[UIButton buttonWithType:UIButtonTypeSystem\];\n(?:    .*javaButton.*\n)+?    \[self\.toolbar addSubview:javaButton\];\n'''
          r, n = re.subn(java_block_pattern, '\n', r, count=1)
          if n != 1:
              raise SystemExit(f'BUILDFIX7 Java toolbar removal: expected one block, found {n}')
          r = r.replace('    // J2ME UIENTRYFIX1: keep every toolbar entry visible, including Java/J2ME.\n',
                        '    // UNIFIEDLIBRARY1: four primary toolbar entries; Java lives inside Apps.\n', 1)

          child_anchor = '    [self.appsTable addGestureRecognizer:longPress];\n'
          child_code = r'''    [self.appsTable addGestureRecognizer:longPress];

              // BUILDFIX7 UNIFIEDLIBRARY1: one icon library for Symbian, J2ME and N-Gage.
              self.unifiedLibrary = [EKAUnifiedLibraryViewController new];
              [self addChildViewController:self.unifiedLibrary];
              self.unifiedLibrary.view.hidden = YES;
              [self.view addSubview:self.unifiedLibrary.view];
              [self.unifiedLibrary didMoveToParentViewController:self];

              __weak RootViewController *unifiedWeakSelf = self;
              self.unifiedLibrary.onLaunchSymbian = ^(uint32_t uid) {
                  [unifiedWeakSelf launchAppUid:uid];
              };
              self.unifiedLibrary.onOpenSymbianSettings = ^(uint32_t uid, NSString *name) {
                  [unifiedWeakSelf openGameSettingsForUid:uid name:name];
              };
              self.unifiedLibrary.onHideSymbian = ^(uint32_t uid, NSString *name) {
                  (void)name;
                  [HiddenAppsViewController setUid:uid hidden:YES];
                  [unifiedWeakSelf showAppsScreen];
              };
          '''
          if 'BUILDFIX7 UNIFIEDLIBRARY1: one icon library' not in r:
              r = replace_once(r, child_anchor, child_code, 'unified child controller')

          # When existing screens hide the legacy table, hide the unified grid as well. Messaging nil
          # during early view construction is safe; showAppsScreen explicitly re-enables the grid.
          r = r.replace('    self.appsTable.hidden = YES;\n',
                        '    self.appsTable.hidden = YES;\n    self.unifiedLibrary.view.hidden = YES;\n')

          layout_anchor = '    self.appsTable.frame = CGRectMake(0, listY, width, self.view.bounds.size.height - listY);\n'
          layout_add = layout_anchor + '    self.unifiedLibrary.view.frame = self.appsTable.frame;\n'
          if 'self.unifiedLibrary.view.frame = self.appsTable.frame;' not in r:
              r = replace_once(r, layout_anchor, layout_add, 'unified layout')

          # showAppsScreen: keep all existing native-app discovery/filtering, then feed it to unified grid.
          def patch_show_apps(m):
              anchor = '    self.apps = list;\n    [self.appsTable reloadData];\n    [self refreshDeviceButton];\n'
              inject = anchor + r'''    int unifiedDeviceIndex = eka2l1::ios::bridge::has_device()
                  ? eka2l1::ios::bridge::get_current_device() : -1;
              NSString *unifiedDeviceKey = [NSString stringWithFormat:@"%d", unifiedDeviceIndex];
              [self.unifiedLibrary reloadWithSymbianApps:list iconCache:self.iconCache deviceKey:unifiedDeviceKey];
              BOOL unifiedHasItems = [self.unifiedLibrary hasAnyItems];
          '''
              m = replace_once(m, anchor, inject, 'showApps reload')
              pattern = (r'    self\.appsTable\.hidden = \(list\.count == 0\);\n'
                         r'    self\.statusLabel\.hidden = \(list\.count != 0\);\n'
                         r'    if \(list\.count == 0\) \{.*?\n    \}\n')
              replacement = ('    // The legacy table remains a launcher-state sentinel for existing code, but the\n'
                             '    // visible launcher is now the unified collection view. Empty sections remain visible.\n'
                             '    self.appsTable.hidden = NO;\n'
                             '    self.unifiedLibrary.view.hidden = NO;\n'
                             '    self.statusLabel.hidden = YES;\n'
                             '    (void)unifiedHasItems;\n')
              m2,n = re.subn(pattern, replacement, m, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'BUILDFIX7 showApps visibility anchor count={n}')
              return m2
          r = patch_method(r, '- (void)showAppsScreen', patch_show_apps)

          # Stream native icons into both old cache and the unified grid.
          def patch_icons(m):
              anchor = '                    self.iconCache[uidNum] = img;\n'
              repl = anchor + '                    [self.unifiedLibrary updateIcon:img forUID:uidNum];\n'
              return replace_once(m, anchor, repl, 'native icon forwarding')
          r = patch_method(r, '- (void)loadIconsForApps:', patch_icons)

          # Keep grid above the legacy table when returning from gameplay.
          def patch_chrome(m):
              anchor = '        [self.view bringSubviewToFront:self.appsTable];\n'
              repl = anchor + '        if (!self.unifiedLibrary.view.hidden) [self.view bringSubviewToFront:self.unifiedLibrary.view];\n'
              return replace_once(m, anchor, repl, 'updateChrome grid z-order')
          r = patch_method(r, '- (void)updateChrome', patch_chrome)

          # Hardware keyboard/controller now navigates the unified grid.
          def patch_input(m):
              old='            [self navigateAppsList:dir];\n'
              new='            [self.unifiedLibrary navigateByDelta:dir];\n'
              return replace_once(m, old, new, 'InputManager unified navigation')
          r = patch_method(r, '- (void)inputManagerDidNavigate:', patch_input)

          # Show the unified J2ME library even if no Symbian firmware exists yet.
          def patch_start(m):
              # In the no-device branch, insert showAppsScreen before auto-device logic. Avoid UI-string anchors.
              needle='        [self maybeAutoInstallDevice];\n'
              repl='        [self showAppsScreen];  // UNIFIEDLIBRARY1: J2ME does not require Symbian firmware.\n' + needle
              return replace_once(m, needle, repl, 'no-device J2ME startup')
          r = patch_method(r, '- (void)startEmulatorIfNeeded', patch_start)

          # Static helpers for unified type routing and per-device N-Gage classification.
          sis_helper = r'''static BOOL EKAIsSisPackagePath(NSString *path) {
              NSString *ext = path.pathExtension.lowercaseString;
              return [ext isEqualToString:@"sis"] || [ext isEqualToString:@"sisx"];
          }
          '''
          helper_add = sis_helper + r'''
          static BOOL EKAIsJARPackagePath(NSString *path) {
              return [path.pathExtension.lowercaseString isEqualToString:@"jar"];
          }

          static NSString *EKAUnifiedCurrentDeviceKey(void) {
              int idx = eka2l1::ios::bridge::has_device() ? eka2l1::ios::bridge::get_current_device() : -1;
              return [NSString stringWithFormat:@"%d", idx];
          }

          static NSSet<NSNumber *> *EKAUnifiedCurrentUIDSet(void) {
              NSMutableSet<NSNumber *> *uids = [NSMutableSet set];
              if (!eka2l1::ios::bridge::has_device()) return uids;
              for (auto &entry : eka2l1::ios::bridge::get_apps()) [uids addObject:@(entry.uid)];
              return uids;
          }
          '''
          if 'static BOOL EKAIsJARPackagePath' not in r:
              r = replace_once(r, sis_helper, helper_add, 'JAR/router helpers')

          # Firmware prerequisite UI, deliberately implemented independently from ManicEMU source.
          firmware_methods = r'''
          // BUILDFIX7 FIRMWAREGATE1: retain the selected package, install firmware, then resume it.
          - (void)presentFirmwareManagerForPendingInstall {
              EKAFirmwareGateViewController *vc = [EKAFirmwareGateViewController new];
              __weak RootViewController *weakSelf = self;
              vc.onClose = ^{ weakSelf.pendingInstallAfterFirmware = nil; };
              vc.onAddFirmware = ^{ [weakSelf onInstallDevice]; };
              vc.modalPresentationStyle = UIModalPresentationPageSheet;
              if (@available(iOS 15.0, *)) {
                  UISheetPresentationController *sheet = vc.sheetPresentationController;
                  sheet.detents = @[[UISheetPresentationControllerDetent largeDetent]];
                  sheet.prefersGrabberVisible = YES;
                  sheet.preferredCornerRadius = 24.0;
              }
              [self presentViewController:vc animated:YES completion:nil];
          }

          - (void)requireFirmwareForPath:(NSString *)path kind:(NSString *)kind {
              self.pendingInstallAfterFirmware = [path copy];
              NSString *platform = [kind isEqualToString:@"N-Gage"] ? @"N-Gage" : @"Symbian";
              NSString *message = [NSString stringWithFormat:@"Cài firmware Symbian OS trước khi thêm trò chơi %@.", platform];
              UIAlertController *sheet = [UIAlertController alertControllerWithTitle:nil message:message
                  preferredStyle:UIAlertControllerStyleActionSheet];
