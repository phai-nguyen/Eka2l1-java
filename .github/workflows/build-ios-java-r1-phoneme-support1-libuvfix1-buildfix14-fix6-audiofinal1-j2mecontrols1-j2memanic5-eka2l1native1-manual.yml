      - name: Install J2ME R1 phoneME interpreter on SUPPORT1
        run: |
          LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
          touch "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          echo "=== STEP: Install J2ME R1 phoneME interpreter on SUPPORT1 ==="
          set -euo pipefail
          ASSET_ROOT="$RUNNER_TEMP/j2me-r1-assets/J2ME-R1-PHONEME-INTERPRETER-ASSETS"
          CORE="$ASSET_ROOT/phoneME/Core"
          UPSTREAM="$GITHUB_WORKSPACE/upstream"
          BUILD="$RUNNER_TEMP/phoneme-core-r1"
          STAGE="$UPSTREAM/third_party/phoneme-r1"

          # Keep the verified J2ME ZIP byte-for-byte. The legacy wrapper ends with
          # R3-specific guards, so run its build/verify/apply payload directly and
          # gate against the frozen SUPPORT1 baseline instead.
          rm -rf "$STAGE" "$BUILD"
          mkdir -p "$STAGE/lib" "$STAGE/include"

          # BUILDFIX11 LOCALEFIX1: the frozen phoneME R1 Core reports en-US for
          # System.getProperty("microedition.locale"). A number of Nokia/Gameloft
          # MIDlets select an embedded language pack from this exact BCP-47 value.
          # Patch only the extracted CI copy; the companion ZIP remains immutable.
          CONSOLE_NATIVES="$CORE/src/vm/ConsoleNatives.cpp"
          python3 - "$CONSOLE_NATIVES" <<'PYCODE'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = 'static constexpr std::array<Property, 10> properties {{'
          if text.count(old) != 1:
              raise SystemExit(f"LOCALEFIX1: property table anchor count={text.count(old)}")
          text = text.replace(old, 'static constexpr std::array<Property, 12> properties {{', 1)
          old_locale = '{u"microedition.locale", u"en-US"},'
          new_locale = ('{u"microedition.locale", u"vi-VN"}, // BUILDFIX11 LOCALEFIX1\n'
                        '        {u"user.language", u"vi"},\n'
                        '        {u"user.country", u"VN"},')
          count = text.count(old_locale)
          if count != 1:
              raise SystemExit(f"LOCALEFIX1: expected one phoneME locale anchor, found {count}")
          path.write_text(text.replace(old_locale, new_locale, 1), encoding="utf-8")
          PYCODE
          grep -Fq 'std::array<Property, 12>' "$CONSOLE_NATIVES"
          grep -Fq '{u"microedition.locale", u"vi-VN"}, // BUILDFIX11 LOCALEFIX1' "$CONSOLE_NATIVES"
          grep -Fq '{u"user.language", u"vi"},' "$CONSOLE_NATIVES"
          grep -Fq '{u"user.country", u"VN"},' "$CONSOLE_NATIVES"
          ! grep -Fq '{u"microedition.locale", u"en-US"},' "$CONSOLE_NATIVES"
          echo 'BUILDFIX11 LOCALEFIX1 vi-VN + user.language/user.country source gates: PASS'
          PHONEME_CORE_BUILD_DIR="$BUILD"           PHONEME_CORE_OUTPUT="$STAGE/lib/libphoneMECore.a"           PHONEME_APPLE_SDK=iphoneos           IOS_DEPLOYMENT_TARGET=15.0           PHONEME_ENABLE_DECODED_EXECUTION=1           PHONEME_ENABLE_THINLTO=0             bash "$CORE/Tools/build-iphoneos.sh"
          PHONEME_CORE_BUILD_DIR="$BUILD"           PHONEME_CORE_OUTPUT="$STAGE/lib/libphoneMECore.a"           PHONEME_APPLE_SDK=iphoneos           IOS_DEPLOYMENT_TARGET=15.0           PHONEME_ENABLE_DECODED_EXECUTION=1           PHONEME_ENABLE_THINLTO=0             bash "$CORE/Tools/verify-iphoneos.sh"
          cp -R "$CORE/include/." "$STAGE/include/"
          python3 "$ASSET_ROOT/scripts/apply_j2me_r1.py" "$UPSTREAM"

          test -s "$STAGE/lib/libphoneMECore.a"
          grep -Fq '#define PHONEME_C_API_VERSION_MAJOR 1u' "$STAGE/include/PhoneMECore.h"
          grep -Fq '#define PHONEME_C_API_VERSION_MINOR 3u' "$STAGE/include/PhoneMECore.h"
          grep -Fq '#define PHONEME_C_API_VERSION_PATCH 0u' "$STAGE/include/PhoneMECore.h"
          grep -Fq 'J2ME R1 PHONEME INTERPRETER' "$UPSTREAM/src/emu/ios/CMakeLists.txt"
          grep -Fq 'onJavaJ2ME' "$UPSTREAM/src/emu/ios/app/RootViewController.mm"
          grep -Fq 'phoneme_configure_jit(g_runtime, 0)' "$UPSTREAM/src/emu/ios/app/j2me/J2MEBridge.mm"
          grep -Fq '{128,128}, {128,160}, {132,176}, {176,220}' "$UPSTREAM/src/emu/ios/app/j2me/J2MEProfile.hpp"
          grep -Fq '{240,320}, {352,416}, {640,360}, {800,480}' "$UPSTREAM/src/emu/ios/app/j2me/J2MEProfile.hpp"
          grep -Fq 'screen_width = std::clamp(screen_width, 1, 2048)' "$UPSTREAM/src/emu/ios/app/j2me/J2MEProfile.hpp"
          grep -Fq 'screen_height = std::clamp(screen_height, 1, 2048)' "$UPSTREAM/src/emu/ios/app/j2me/J2MEProfile.hpp"
          grep -Fq 'scale_percent = std::clamp(scale_percent, 10, 300)' "$UPSTREAM/src/emu/ios/app/j2me/J2MEProfile.hpp"
          ! grep -R -qE 'phoneme/(runtime|base)/|std::expected' "$UPSTREAM/src/emu/ios/app/j2me"

          # SUPPORT1 regression gates must still be present after the additive Java patch.
          ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
          CODESEG="$UPSTREAM/src/emu/kernel/src/codeseg.cpp"
          grep -Fq 'NGAGE CLASSIC R2FX2 R2 CRASHFIX1:' "$ROOT"
          grep -Fq 'com.eka2l1.ngage.lifecycle' "$ROOT"
          test "$(grep -Fc 'dispatch_async(EKANgageLifecycleQueue(), ^{' "$ROOT")" -eq 2
          grep -Fq 'exit bridge-call' "$ROOT"
          grep -Fq 'exit bridge-return' "$ROOT"
          grep -Fq 'device-switch bridge-call' "$ROOT"
          grep -Fq 'device-switch bridge-return' "$ROOT"
          grep -Fq 'NGAGE CLASSIC R2FX2 COMPATIBILITY R2 EXPORTMAP BATCH1:' "$CODESEG"
          grep -Fq 'unresolved NEW guest ordinal=' "$CODESEG"
