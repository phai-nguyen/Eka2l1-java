              uint32_t result = 0;
              for (NSUInteger index = 0; index < 4; ++index) {
                  if (*cursor >= end) return NO;
                  const uint8_t byte = bytes[(*cursor)++];
                  result = (result << 7U) | (uint32_t)(byte & 0x7fU);
                  if ((byte & 0x80U) == 0) {
                      *value = result;
                      return YES;
                  }
