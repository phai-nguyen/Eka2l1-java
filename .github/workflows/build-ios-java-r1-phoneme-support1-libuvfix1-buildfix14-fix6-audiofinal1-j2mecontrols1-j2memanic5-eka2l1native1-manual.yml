          import sys
          from pathlib import Path
          player=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          editor=Path(sys.argv[2]).read_text(encoding='utf-8',errors='replace')

          def method(text, sig):
              start=text.find(sig)
              if start < 0: raise SystemExit(f'missing method: {sig}')
              if text.find(sig,start+1) >= 0: raise SystemExit(f'non-unique method: {sig}')
              b=text.find('{',start); depth=0; i=b; ins=inc=inl=inb=esc=False
              while i < len(text):
                  ch=text[i]; nx=text[i+1] if i+1<len(text) else ''
                  if inl:
                      if ch=='\n': inl=False
                  elif inb:
                      if ch=='*' and nx=='/': inb=False; i+=1
                  elif ins:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch=='"': ins=False
                  elif inc:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch=="'": inc=False
                  else:
                      if ch=='/' and nx=='/': inl=True; i+=1
                      elif ch=='/' and nx=='*': inb=True; i+=1
                      elif ch=='"': ins=True
                      elif ch=="'": inc=True
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0: return text[start:i+1]
                  i+=1
              raise SystemExit(f'unterminated method: {sig}')

          flex=method(player,'- (void)showJ2MEFlexMenu')
          assert '[self openJ2MEEkaNativeControlEditor];' in flex
          assert 'UIAlertController' not in flex
          layout=method(player,'- (void)viewDidLayoutSubviews')
          assert 'rendered_frame_rect' in layout
          assert 'manicViewportScale' not in layout and 'manicViewportOffset' not in layout
          toolbar=method(editor,'- (void)setupToolbar')
          ext=toolbar.split('if (_externalMode)',1)[1].split('} else {',1)[0]
          assert 'onShrink' in ext and 'onGrow' in ext and 'onReset' in ext
          assert 'onAdd' not in ext and 'onDelete' not in ext

          forbidden=[
              'j2meManicBeginScreenZoom','j2meManicScreenPinch:','j2meManicScreenPan:',
              'showJ2MEManicScreenSizeMenu','j2meManicBeginButtonEdit','showJ2MEManicButtonSizeMenu',
              'showJ2MEManicKeyMappingPicker','showJ2MEManicMappingTargetsForControlID:',
              '_manicScreenPinch','_manicScreenPan','_manicScreenEditing','_manicHint'
          ]
          for token in forbidden:
              assert token not in player, token
          print('J2MEMANIC5 native-editor/screen semantic gates: PASS')
          PY_NATIVE_GATES

          # Tested Java MIDP path, physical animation and direction arbiter remain frozen.
          grep -Fq 'j2meManicRouteScancode' "$PLAYER"
          grep -Fq '_manicDirectionRefCounts' "$PLAYER"
          grep -Fq 'controlVisualOutput)(NSString *controlID, BOOL down)' "$GCV_H"
          grep -Fq 'controlID:(el[@"asset"] ?: el[@"label"])' "$GCV"
          grep -Fq 'setControlIdentifier:(NSString *)controlID down:(BOOL)down' "$MANIC_H"

          # J2MEMANIC3 artwork/geometry and AUDIOFINAL1/companion remain frozen.
          echo 'b9f1b12f0b87b39ac259bd0df1fcd8bad7fef4a2f24e4a75b9791f529e8054c6  '"$INFO" | shasum -a 256 -c -
          grep -Fq 'GM-SYNTH1 renderer=gm-sf2' "$MEDIA"
          grep -Fq 'GM-SYNTH1 renderer=legacy-fallback' "$MEDIA"
          echo "536c7ef535a20ce1dd585c4800bf3770711e372f6629bc561b8128a337e56b40  $COMPANION" | shasum -a 256 -c -
          git -C "$UPSTREAM" diff --check
          echo 'J2MEMANIC5 EKA2L1NATIVE1 source gates: PASS'

