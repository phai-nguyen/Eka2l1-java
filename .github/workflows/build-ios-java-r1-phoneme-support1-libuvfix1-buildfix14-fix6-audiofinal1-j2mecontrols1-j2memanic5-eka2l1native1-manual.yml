          python3 - "$INFO" <<'PY_GEOMETRY'
          import json, sys
          from pathlib import Path
          info=json.loads(Path(sys.argv[1]).read_text())
          e=info['representations']['iphone']['edgeToEdge']
          assert e['portrait']['mappingSize']=={'width':375,'height':812}
          assert e['landscape']['mappingSize']=={'width':812,'height':375}
          print('J2MEMANIC4 J2MEMANIC3 geometry freeze: PASS')
          PY_GEOMETRY
          grep -Fq 'GM-SYNTH1 renderer=gm-sf2' "$MEDIA"
          grep -Fq 'GM-SYNTH1 renderer=legacy-fallback' "$MEDIA"
