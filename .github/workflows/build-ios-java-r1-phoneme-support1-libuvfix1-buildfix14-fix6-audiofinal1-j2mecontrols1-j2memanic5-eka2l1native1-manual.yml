          ! grep -Fq 'ord == 63' "$CODESEG"
          git -C "$UPSTREAM" diff --check
          echo 'J2ME R1 phoneME interpreter + SUPPORT1 preservation: PASS'

      - name: Apply J2ME UIENTRYFIX1 visible toolbar entry
        run: |
          LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
          touch "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          echo "=== STEP: Apply J2ME UIENTRYFIX1 visible toolbar entry ==="
          set -euo pipefail
          UPSTREAM="$GITHUB_WORKSPACE/upstream"
          ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"

          python3 - "$ROOT" <<'PYCODE'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          text = root.read_text(encoding="utf-8")

          def replace_once(value, old, new, label):
              count = value.count(old)
              if count != 1:
                  raise SystemExit(
                      f"J2ME UIENTRYFIX1: {label}: expected exactly one anchor, found {count}"
                  )
              return value.replace(old, new, 1)

          old_button = "\n".join([
              '    [javaButton setTitle:@"Java" forState:UIControlStateNormal];',
              '    [javaButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];',
              '    javaButton.titleLabel.font = [UIFont systemFontOfSize:14 weight:UIFontWeightMedium];',
              '    [javaButton addTarget:self action:@selector(onJavaJ2ME) forControlEvents:UIControlEventTouchUpInside];',
              '    [self.toolbar addSubview:javaButton];',
          ]) + "\n"
          new_button = "\n".join([
              '    [javaButton setTitle:@"Java/J2ME" forState:UIControlStateNormal];',
              '    [javaButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];',
              '    javaButton.titleLabel.font = [UIFont systemFontOfSize:14 weight:UIFontWeightMedium];',
              '    javaButton.accessibilityIdentifier = @"eka2l1.java.j2me";',
              '    [javaButton addTarget:self action:@selector(onJavaJ2ME) forControlEvents:UIControlEventTouchUpInside];',
              '    [self.toolbar addSubview:javaButton];',
          ]) + "\n"
          text = replace_once(text, old_button, new_button, "Java toolbar button")

          old_layout = "\n".join([
              '    self.toolbar.frame = CGRectMake(0, top, width, barH);',
              '    CGFloat bx = 8;',
              '    for (UIView *sub in self.toolbar.subviews) {',
              '        [(UIButton *)sub sizeToFit];',
              '        CGRect f = sub.frame;',
              '        f.size.width += 12; f.origin.x = bx; f.origin.y = (barH - f.size.height) / 2;',
              '        sub.frame = f; bx += f.size.width + 10;',
              '    }',
          ]) + "\n"
          new_layout = "\n".join([
              '    self.toolbar.frame = CGRectMake(0, top, width, barH);',
              '    // J2ME UIENTRYFIX1: keep every toolbar entry visible, including Java/J2ME.',
              '    NSArray<UIView *> *toolbarItems = self.toolbar.subviews;',
              '    NSUInteger toolbarCount = toolbarItems.count;',
              '    CGFloat toolbarPad = 4.0;',
              '    CGFloat toolbarGap = 2.0;',
              '    CGFloat itemWidth = toolbarCount > 0',
              '        ? (width - (2.0 * toolbarPad) - (toolbarGap * (toolbarCount - 1))) / (CGFloat)toolbarCount',
              '        : 0.0;',
              '    for (NSUInteger i = 0; i < toolbarCount; i++) {',
              '        UIButton *button = (UIButton *)toolbarItems[i];',
              '        button.titleLabel.font = [UIFont systemFontOfSize:(toolbarCount >= 5 ? 12.0 : 14.0)',
              '                                                   weight:UIFontWeightMedium];',
              '        button.titleLabel.adjustsFontSizeToFitWidth = YES;',
              '        button.titleLabel.minimumScaleFactor = 0.72;',
              '        button.titleLabel.lineBreakMode = NSLineBreakByClipping;',
              '        button.contentHorizontalAlignment = UIControlContentHorizontalAlignmentCenter;',
              '        button.frame = CGRectMake(toolbarPad + (i * (itemWidth + toolbarGap)), 0, itemWidth, barH);',
              '    }',
          ]) + "\n"
          text = replace_once(text, old_layout, new_layout, "width-aware toolbar layout")
          root.write_text(text, encoding="utf-8")
          PYCODE

          grep -Fq 'J2ME UIENTRYFIX1: keep every toolbar entry visible' "$ROOT"
          grep -Fq '[javaButton setTitle:@"Java/J2ME" forState:UIControlStateNormal]' "$ROOT"
          grep -Fq 'javaButton.accessibilityIdentifier = @"eka2l1.java.j2me"' "$ROOT"
          grep -Fq '@selector(onJavaJ2ME)' "$ROOT"
          grep -Fq 'NSArray<UIView *> *toolbarItems = self.toolbar.subviews' "$ROOT"
          grep -Fq 'button.titleLabel.adjustsFontSizeToFitWidth = YES' "$ROOT"
          grep -Fq 'button.titleLabel.minimumScaleFactor = 0.72' "$ROOT"
          grep -Fq 'button.contentHorizontalAlignment = UIControlContentHorizontalAlignmentCenter' "$ROOT"
          ! grep -Fq 'CGFloat bx = 8;' "$ROOT"
          git -C "$UPSTREAM" diff --check
          echo 'J2ME UIENTRYFIX1 visible toolbar entry: PASS'

