                  const NSUInteger nextCapacity = *capacity == 0 ? 16 : *capacity * 2;
                  PMMIDITempo *next = realloc(*tempos,
                                              nextCapacity * sizeof(PMMIDITempo));
                  if (next == NULL) return NO;
                  *tempos = next;
                  *capacity = nextCapacity;
              }
              (*tempos)[(*count)++] = tempo;
