          J2MEMANIC3_B64
          /usr/bin/base64 --decode -i "$RUNNER_TEMP/j2memanic3.b64" -o "$PATCH_ZIP"
          echo "cce3286fd99d0acd91d4b55754c7b5c4ac43b5f9222934ddde33adb4730f8741  $PATCH_ZIP" | shasum -a 256 -c -
          rm -rf "$PATCH_DIR"
          mkdir -p "$PATCH_DIR"
          /usr/bin/unzip -q "$PATCH_ZIP" -d "$PATCH_DIR"
          PAYLOAD="$PATCH_DIR/J2MEMANIC3"
          (cd "$PAYLOAD" && shasum -a 256 -c SHA256SUMS.txt)
          python3 -m py_compile "$PAYLOAD/J2MEMANIC3.patch.py"
          python3 "$PAYLOAD/J2MEMANIC3.patch.py" "$UPSTREAM" "$PAYLOAD"

          PLAYER="$UPSTREAM/src/emu/ios/app/j2me/J2MEPlayerViewController.mm"
          GCVH="$UPSTREAM/src/emu/ios/app/GameControlsView.h"
          GCVM="$UPSTREAM/src/emu/ios/app/GameControlsView.mm"
          MANICH="$UPSTREAM/src/emu/ios/app/j2me/J2MEManicControlsView.h"
          MANIC="$UPSTREAM/src/emu/ios/app/j2me/J2MEManicControlsView.m"
          SKIN="$UPSTREAM/src/emu/ios/app/j2me/J2MEManicControls/info.json"
          CMAKE="$UPSTREAM/src/emu/ios/CMakeLists.txt"
          MEDIA="$UPSTREAM/src/emu/ios/app/j2me/PhoneMEMediaBridge.m"
          COMPANION="$GITHUB_WORKSPACE/EKA2L1-JAVA-R1-PHONEME-SUPPORT1-LIBUVFIX1.zip"

          # 1. Independent physical D-pad and thumbstick sources.
          grep -Fq 'J2MEManicDirectionalInputView' "$MANICH"
          grep -Fq 'NSMutableSet<NSNumber *> *_dpadCodes' "$MANIC"
          grep -Fq 'NSMutableSet<NSNumber *> *_joystickCodes' "$MANIC"
          grep -Fq 'NSMutableDictionary<NSNumber *,NSNumber *> *_directionRefCounts' "$MANIC"
          grep -Fq 'dpadVectorOutput' "$MANIC"
          grep -Fq 'joystickVectorOutput' "$MANIC"
          grep -Fq 'J2MEManicGuestControlLayout' "$MANIC"
          grep -Fq '_manicDirectional.directionOutput=' "$PLAYER"
          grep -Fq '_manicDirectional.dpadVectorOutput=' "$PLAYER"
          grep -Fq '_manicDirectional.joystickVectorOutput=' "$PLAYER"
          grep -Fq '_controls.customLayout=J2MEManicGuestControlLayout(full)' "$PLAYER"

          # 2. Gear restores the original EKA2L1 Java game menu.
          grep -Fq 'alertControllerWithTitle:@"Menu trò chơi"' "$PLAYER"
          grep -Fq 'actionWithTitle:@"Đổi bố cục phím"' "$PLAYER"
          grep -Fq 'actionWithTitle:@"Thoát trò chơi"' "$PLAYER"
          grep -Fq 'actionWithTitle:@"Hủy"' "$PLAYER"
          grep -Fq 'for(NSNumber *n in J2MEPlayerLayoutOrder())' "$PLAYER"

          # 3. Manic orientation representations remain distinct and exact.
          grep -Fq 'manic3ControlLayout%@_%.0fx%.0f' "$PLAYER"
          grep -Fq 'J2MEManicLayoutMatchesCurrentRepresentation' "$PLAYER"
          grep -Fq 'J2MEMANIC3 rejects J2MEMANIC1/2' "$PLAYER"
          grep -Fq 'viewWillTransitionToSize:' "$PLAYER"
          grep -Fq 'J2MEManicCurrentMappingSize' "$MANIC"
          grep -Fq 'MIN(bounds.size.width / mapSize.width, bounds.size.height / mapSize.height)' "$MANIC"
          grep -Fq 'MIN(bounds.size.width/mapW,bounds.size.height/mapH)' "$MANIC"
          grep -Fq 'CGRect controlCanvas=self.view.bounds' "$PLAYER"
          grep -Fq '_manicDirectional.frame=controlCanvas' "$PLAYER"

          python3 - "$SKIN" <<'PY_SKIN'
          import json, sys
          info=json.load(open(sys.argv[1],encoding='utf-8'))
          edge=info['representations']['iphone']['edgeToEdge']
          p=edge['portrait']; l=edge['landscape']
          assert p['mappingSize']=={'width':375,'height':812}, p['mappingSize']
          assert l['mappingSize']=={'width':812,'height':375}, l['mappingSize']
          def classify(item):
              if 'thumbstick' in item: return 'joystick'
              if isinstance(item.get('inputs'),dict): return 'dpad'
              v=item.get('inputs')
              return v[0] if isinstance(v,list) and v else None
          lm={classify(i):i['frame'] for i in l['items'] if classify(i) in ('joystick','dpad','fire','menu','flex')}
          assert lm['joystick']=={'x':50,'y':81,'width':60,'height':60}, lm
          assert lm['dpad']=={'height':136,'width':136,'x':62,'y':166}, lm
          assert lm['fire']=={'x':702,'y':81,'width':60,'height':60}, lm
          assert lm['menu']=={'height':32,'width':32,'x':50,'y':327}, lm
          assert lm['flex']=={'height':32,'width':32,'x':98,'y':327}, lm
          print('J2MEMANIC3 exact iPhone edge-to-edge landscape skin geometry: PASS')
          PY_SKIN

          # 4. Press feedback and editor remain, but directional visuals are separated.
          grep -Fq 'keyVisualOutput' "$GCVH"
          grep -Fq 'self.keyVisualOutput' "$GCVM"
          grep -Fq 'CGRectInset(r,ix,iy)' "$MANIC"
          grep -Fq 'setDpadVectorX:' "$MANIC"
          grep -Fq 'setJoystickVectorX:' "$MANIC"
          grep -Fq 'MIN(r.size.width,r.size.height)*0.34' "$MANIC"
          grep -Fq 'actionWithTitle:@"Thu phóng màn hình"' "$PLAYER"
          grep -Fq 'actionWithTitle:@"Chỉnh kích thước nút"' "$PLAYER"
          grep -Fq 'actionWithTitle:@"Chỉnh ánh xạ phím"' "$PLAYER"

          # Exact skin resources stay bundled from the supplied .manicskin.
          grep -Fq 'J2MEMANIC3 skin resources and helper source.' "$CMAKE"
          test -f "$UPSTREAM/src/emu/ios/app/j2me/J2MEManicControls/dpad.png"
          test -f "$UPSTREAM/src/emu/ios/app/j2me/J2MEManicControls/thumbstick.png"
          test -f "$UPSTREAM/src/emu/ios/app/j2me/J2MEManicControls/menu_button.png"
          test -f "$UPSTREAM/src/emu/ios/app/j2me/J2MEManicControls/flex_button.png"

          # Existing runtime-validated MIDP mapping remains frozen.
          grep -Fq "case '*':  *outKey=42; return YES;" "$PLAYER"
          grep -Fq 'case 0x7F: *outKey=35; return YES;' "$PLAYER"
          grep -Fq 'case 0x10: *outKey=-1; return YES;' "$PLAYER"
          grep -Fq 'case 0x11: *outKey=-2; return YES;' "$PLAYER"
          grep -Fq 'case 0x0E: *outKey=-3; return YES;' "$PLAYER"
          grep -Fq 'case 0x0F: *outKey=-4; return YES;' "$PLAYER"
          grep -Fq 'case 0xA7: *outKey=-5; return YES;' "$PLAYER"
          grep -Fq 'case 0xA4: *outKey=-6; return YES;' "$PLAYER"
          grep -Fq 'case 0xA5: *outKey=-7; return YES;' "$PLAYER"

          # AUDIOFINAL1 and companion are frozen.
          grep -Fq 'GM-SYNTH1 renderer=gm-sf2' "$MEDIA"
          grep -Fq 'GM-SYNTH1 renderer=legacy-fallback' "$MEDIA"
          echo "536c7ef535a20ce1dd585c4800bf3770711e372f6629bc561b8128a337e56b40  $COMPANION" | shasum -a 256 -c -
          git -C "$UPSTREAM" diff --check
          echo 'J2MEMANIC3 independent directions + exact rotation mapping source gates: PASS'

