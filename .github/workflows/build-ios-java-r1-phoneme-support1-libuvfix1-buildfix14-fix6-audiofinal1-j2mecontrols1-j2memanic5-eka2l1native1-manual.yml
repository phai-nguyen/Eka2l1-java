          GCV="$UPSTREAM/src/emu/ios/app/GameControlsView.mm"
          PLAYER="$UPSTREAM/src/emu/ios/app/j2me/J2MEPlayerViewController.mm"
          MANIC_H="$UPSTREAM/src/emu/ios/app/j2me/J2MEManicControlsView.h"
          MANIC_M="$UPSTREAM/src/emu/ios/app/j2me/J2MEManicControlsView.m"
          INFO="$UPSTREAM/src/emu/ios/app/j2me/J2MEManicControls/info.json"
          MEDIA="$UPSTREAM/src/emu/ios/app/j2me/PhoneMEMediaBridge.m"

