          grep -Fq 'MANICCTRL-DIAG1 representation=' "$PLAYER"
          grep -Fq 'MANICCTRL-DIAG1 mapping-change control=' "$PLAYER"
          grep -Fq 'MANICCTRL-DIAG1 layout-save rep=' "$PLAYER"
          grep -Fq 'MANICCTRL-DIAG1 layout-reset rep=' "$PLAYER"
          grep -Fq 'MANICCTRL-DIAG1 rotation-begin' "$PLAYER"
          grep -Fq 'MANICCTRL-DIAG1 rotation-end rep=' "$PLAYER"
