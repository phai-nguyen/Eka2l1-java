name: Build EKA2L1 iOS Java R1 phoneME SUPPORT1 LIBUVFIX1 Manual IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight Java R1 SUPPORT1 bundle
        run: |
          set -euo pipefail
          BUNDLE="$GITHUB_WORKSPACE/EKA2L1-JAVA-R1-PHONEME-SUPPORT1-LIBUVFIX1.zip"
          EXPECTED_BUNDLE_SHA="536c7ef535a20ce1dd585c4800bf3770711e372f6629bc561b8128a337e56b40"
          BUNDLE_DIR="$RUNNER_TEMP/eka2l1-java-bundle"
          BUNDLE_ROOT="$BUNDLE_DIR/EKA2L1-JAVA-R1-PHONEME-SUPPORT1-LIBUVFIX1"
          SUPPORT_ZIP="$BUNDLE_ROOT/EKA2L1-NGAGE-R2FX2-R2-CRASHFIX1-SUPPORT1.zip"
          J2ME_ZIP="$BUNDLE_ROOT/J2ME-R1-PHONEME-INTERPRETER-ASSETS.zip"
          SUPPORT_DIR="$RUNNER_TEMP/eka2l1-ngage-support"
          J2ME_DIR="$RUNNER_TEMP/j2me-r1-assets"
          J2ME_ROOT="$J2ME_DIR/J2ME-R1-PHONEME-INTERPRETER-ASSETS"

          if [ ! -f "$BUNDLE" ]; then
            echo "ERROR: required bundle is missing: $BUNDLE" >&2
            echo "Place EKA2L1-JAVA-R1-PHONEME-SUPPORT1-LIBUVFIX1.zip at the repository root, then run this workflow manually." >&2
            exit 1
          fi
          echo "$EXPECTED_BUNDLE_SHA  $BUNDLE" | shasum -a 256 -c -
          rm -rf "$BUNDLE_DIR" "$SUPPORT_DIR" "$J2ME_DIR"
          mkdir -p "$BUNDLE_DIR" "$SUPPORT_DIR" "$J2ME_DIR"
          /usr/bin/unzip -q "$BUNDLE" -d "$BUNDLE_DIR"
          test -f "$BUNDLE_ROOT/MANIFEST.json"
          test -f "$BUNDLE_ROOT/SHA256SUMS.txt"
          (cd "$BUNDLE_ROOT" && shasum -a 256 -c SHA256SUMS.txt)
          echo "10877e51ad6c4415623162a6aabb1c11cd60a3ddd55cea30ae4af6ad84020e16  $SUPPORT_ZIP" | shasum -a 256 -c -
          echo "921eba0e3c91496d691434c6fabfb59c66922e551922de68e1aa294795ee87f8  $J2ME_ZIP" | shasum -a 256 -c -

          /usr/bin/unzip -q "$SUPPORT_ZIP" -d "$SUPPORT_DIR"
          (cd "$SUPPORT_DIR" && shasum -a 256 -c SHA256SUMS.txt)
          test -f "$SUPPORT_DIR/payload/SYM.ROM"
          test -f "$SUPPORT_DIR/payload/NGAGE_CLASSIC_R1_BUNDLED_NEM4_PATCH.py"
          test -f "$SUPPORT_DIR/payload/NGAGE_CLASSIC_R2A_FIX1_CLASSICIMPORT_PATCH.py"
          test -f "$SUPPORT_DIR/payload/NGAGE_CLASSIC_R2A_FIX3_BUILDFIX1_MULTIIMPORT_PATCH.py"
          test -f "$SUPPORT_DIR/payload/NGAGE_CLASSIC_R2A_FIX4_DISPATCHER_PATCH.py"
          test -f "$SUPPORT_DIR/payload/NGAGE_CLASSIC_R2FX2_R2_CRASHFIX1_PATCH.py"

          /usr/bin/unzip -q "$J2ME_ZIP" -d "$J2ME_DIR"
          test -f "$J2ME_ROOT/MANIFEST.json"
          test -f "$J2ME_ROOT/phoneME/Core/include/PhoneMECore.h"
          test -f "$J2ME_ROOT/scripts/apply_j2me_r1.py"
          test -f "$J2ME_ROOT/scripts/install-j2me-r1.sh"
          (cd "$J2ME_ROOT" && shasum -a 256 -c SHA256SUMS.txt)
          python3 - <<'PYCODE'
          import json, os
          outer = os.path.join(os.environ['RUNNER_TEMP'], 'eka2l1-java-bundle', 'EKA2L1-JAVA-R1-PHONEME-SUPPORT1-LIBUVFIX1', 'MANIFEST.json')
          j2me = os.path.join(os.environ['RUNNER_TEMP'], 'j2me-r1-assets', 'J2ME-R1-PHONEME-INTERPRETER-ASSETS', 'MANIFEST.json')
          o = json.load(open(outer, encoding='utf-8'))
          j = json.load(open(j2me, encoding='utf-8'))
          assert o['baseline'] == 'R2FX2 R2 CRASHFIX1 SUPPORT1 FROZEN/PASS'
          assert o['r3_rm612_used'] is False
          assert o['workflow_dispatch_only'] is True
          assert o['libuv']['fetch_libuv'] is True
          assert o['libuv']['fetchcontent_source_dir_libuv'] == '$PWD/src/external/libuv'
          assert o['libuv']['separate_libuv_download'] is False
          assert o['build']['jobs'] == 1
          assert j['phoneme_commit'] == '90c9e12'
          assert j['c_api'] == '1.3.0'
          assert j['jit'] is False
          assert j['r3_rm612_modified'] is False
          assert j['resolution_presets'] == [[128,128],[128,160],[132,176],[176,220],[240,320],[352,416],[640,360],[800,480]]
          assert j['custom_range'] == [1,2048]
          assert j['scale_percent'] == [10,300]
          assert j['phoneME_internal_cpp_headers_in_eka2l1'] is False
          print('Java R1 SUPPORT1 bundle manifest: PASS')
          PYCODE
          echo 'Java R1 SUPPORT1 manual input preflight: PASS'
      - name: Clone EKA2L1 iOS fork with submodules
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/MuhannadYT/EKA2L1_IOS.git upstream

      - name: Verify recursive local libuv source
        working-directory: upstream
        run: |
          set -euo pipefail
          test -f src/external/libuv/CMakeLists.txt
          test -f src/external/uvw/CMakeLists.txt
          git -C src/external/libuv rev-parse --is-inside-work-tree >/dev/null
          git -C src/external/libuv rev-parse HEAD
          grep -Fq 'FETCH_LIBUV' src/external/uvw/CMakeLists.txt
          echo 'LIBUVFIX1 local recursive submodule source: PASS'

      - name: Install V8 IPC/ALF diagnostics and all prior fixes
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_01.py"


      - name: Install V9 FBS95 BitmapCreate ABI fix
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_02.py"

      - name: Verify V9 source markers
        run: |
          set -euo pipefail
          grep -Fq 'V9 FBS95 CREATE:' upstream/src/emu/services/src/fbs/impls/bitmap.cpp
          grep -Fq 'V9 FBS95 LEGACY24:' upstream/src/emu/services/src/fbs/impls/bitmap.cpp
          grep -Fq 'epoc_version >= epocver::epoc95' upstream/src/emu/services/src/fbs/impls/bitmap.cpp
          grep -Fq 'V8 IPCCTX:' upstream/src/emu/services/include/services/context.h
          grep -Fq 'debug_server_name()' upstream/src/emu/services/src/context.cpp
          grep -Fq 'V8 ALF95:' upstream/src/emu/services/src/audio/alf/alf.cpp
          grep -Fq 'V8 ALF95 COMPAT:' upstream/src/emu/services/src/audio/alf/alf.cpp
          grep -Fq 'V8 ALF95 IPCMISS:' upstream/src/emu/services/src/audio/alf/alf.cpp
          grep -Fq 'V7 AKNICON95:' upstream/src/emu/services/src/init.cpp
          grep -Fq 'V7 OPENVG95 COVERAGE:' upstream/src/emu/dispatch/src/libraries/register.cpp
          grep -Fq 'V6 OPENVG95:' upstream/src/emu/dispatch/src/libraries/register.cpp
          grep -Fq 'V5 SVC95:' upstream/src/emu/kernel/src/libmanager.cpp
          grep -Fq 'V5 SVCMISS:' upstream/src/emu/kernel/src/libmanager.cpp
          grep -Fq 'V5 CODEDUMP: reentrancy guard enabled' upstream/src/emu/kernel/src/codedump_collector.cpp
          grep -Fq 'V3 EPOC95:' upstream/src/emu/system/src/software.cpp
          grep -Fq 'V3 ROMBSS:' upstream/src/emu/kernel/src/codeseg.cpp
          grep -Fq 'Select Files in This Folder' upstream/src/emu/ios/app/RootViewController.mm
          echo 'V9 source markers: PASS'

      - name: Install V10 AknIcon GetContentDim and Leave -5 attribution
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_03.py"

      - name: Verify V10 source markers
        run: |
          set -euo pipefail
          grep -Fq 'V10 AKNICON95 CONTENTDIM:' upstream/src/emu/services/src/ui/icon/icon.cpp
          grep -Fq 'case akn_icon_server_get_content_dim:' upstream/src/emu/services/src/ui/icon/icon.cpp
          grep -Fq 'akn_content_dimensions' upstream/src/emu/services/include/services/ui/icon/common.h
          grep -Fq 'float width;' upstream/src/emu/services/include/services/ui/icon/common.h
          grep -Fq 'flag_use_default_icon_dir = 0x0001' upstream/src/emu/services/include/services/ui/icon/common.h
          grep -Fq 'flag_mbm_icon = 0x0002' upstream/src/emu/services/include/services/ui/icon/common.h
          grep -Fq 'flag_exclude_from_cache = 0x0004' upstream/src/emu/services/include/services/ui/icon/common.h
          grep -Fq 'flag_disable_compression = 0x0008' upstream/src/emu/services/include/services/ui/icon/common.h
          grep -Fq 'TAknContentDimensions ABI must stay 8 bytes' upstream/src/emu/services/include/services/ui/icon/common.h
          grep -Fq 'TAknIconSrvReturnData ABI must stay 16 bytes' upstream/src/emu/services/include/services/ui/icon/common.h
          grep -Fq 'V10 IPCERR:' upstream/src/emu/services/src/context.cpp
          grep -Fq 'V9 FBS95 CREATE:' upstream/src/emu/services/src/fbs/impls/bitmap.cpp
          echo 'V10 source markers: PASS'

      - name: Install V11 AknIcon raster, FBS95 FontSpec v2 and Leave-5 diagnostics
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_04.py"

      - name: Verify V11 source markers
        run: |
          set -euo pipefail
          grep -Fq 'V11 AKNICON95 RASTER:' upstream/src/emu/services/src/ui/icon/icon.cpp
          grep -Fq 'V11 CONTENTDIM PRECOMPLETE:' upstream/src/emu/services/src/ui/icon/icon.cpp
          grep -Fq 'V11 CONTENTDIM POSTCOMPLETE:' upstream/src/emu/services/src/ui/icon/icon.cpp
          grep -Fq 'V11 FBS95 FONT: layout=v2' upstream/src/emu/services/src/fbs/impls/font.cpp
          grep -Fq 'FontSpec v2 ABI must stay 72 bytes' upstream/src/emu/services/include/services/fbs/font.h
          grep -Fq 'V11 LEAVE5:' upstream/src/emu/kernel/src/svc.cpp
          grep -Fq 'V10 AKNICON95 CONTENTDIM:' upstream/src/emu/services/src/ui/icon/icon.cpp
          grep -Fq 'V9 FBS95 CREATE:' upstream/src/emu/services/src/fbs/impls/bitmap.cpp
          echo 'V11 source markers: PASS'

      - name: Install V12 MMF95 opcode 45 priority settings fix
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_05.py"

      - name: Verify V12 source markers
        run: |
          set -euo pipefail
          grep -Fq 'case epoc::mmf_dev_newarch_set_priority_settings:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V12 MMF95 PRIORITY: opcode=45 dispatch' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'set_priority_settings(ctx);' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V11 AKNICON95 RASTER:' upstream/src/emu/services/src/ui/icon/icon.cpp
          grep -Fq 'V10 AKNICON95 CONTENTDIM:' upstream/src/emu/services/src/ui/icon/icon.cpp
          grep -Fq 'V9 FBS95 CREATE:' upstream/src/emu/services/src/fbs/impls/bitmap.cpp
          echo 'V12 source markers: PASS'

      - name: Install V13 MMF95 112-byte audio ABI fix
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_06.py"

      - name: Verify V13 source markers
        run: |
          set -euo pipefail
          grep -Fq 'struct mmf_dev_sound_proxy_settings_v2' upstream/src/emu/services/include/services/audio/mmf/common.h
          grep -Fq 'sizeof(mmf_dev_sound_proxy_settings_v2) == 112' upstream/src/emu/services/include/services/audio/mmf/common.h
          grep -Fq 'sizeof(mmf_priority_settings_v2) == 16' upstream/src/emu/services/include/services/audio/mmf/common.h
          grep -Fq 'V13 MMF95 PRIORITYABI:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V13 MMF95 CONFIG:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V13 MMF95 ABI112:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V13 MMF95 PLAYINIT:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V12 MMF95 PRIORITY: opcode=45 dispatch' upstream/src/emu/services/src/audio/mmf/dev.cpp
          echo 'V13 source markers: PASS'


      - name: Install V14 DevSound refill starvation fix
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_07.py"

      - name: Verify V14 source markers
        run: |
          set -euo pipefail
          grep -Fq 'V14 DSP REFILL:' upstream/src/emu/drivers/src/audio/backend/dsp_shared.cpp
          grep -Fq 'more_requested.exchange(true' upstream/src/emu/drivers/src/audio/backend/dsp_shared.cpp
          grep -Fq 'low_water_mark_samples' upstream/src/emu/drivers/src/audio/backend/dsp_shared.cpp
          grep -Fq 'V14 MMF95 STREAMINIT:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V14 MMF95 FORMAT:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V14 MMF95 CONFIGBUF:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V14 MMF95 GETBUF:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V14 MMF95 PLAYDATA:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V13 MMF95 ABI112:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V12 MMF95 PRIORITY: opcode=45 dispatch' upstream/src/emu/services/src/audio/mmf/dev.cpp
          echo 'V14 source markers: PASS'

      - name: Install V15 FIXED2 DevSound retry + kernel try_lock
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_08.py"

      - name: Verify V15 FIXED2 source markers
        run: |
          set -euo pipefail
          grep -Fq 'using dsp_stream_notification_callback = std::function<bool(void *)>;' upstream/src/emu/drivers/include/drivers/audio/dsp.h
          grep -Fq 'V15 DSP RETRY:' upstream/src/emu/drivers/src/audio/backend/dsp_shared.cpp
          grep -Fq 'const bool delivered = more_buffer_callback_(more_buffer_userdata_)' upstream/src/emu/drivers/src/audio/backend/dsp_shared.cpp
          grep -Fq 'more_requested.store(false, std::memory_order_release)' upstream/src/emu/drivers/src/audio/backend/dsp_shared.cpp
          grep -Fq 'V15 MMF95 RETRY: playback kernel busy' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'std::unique_lock<kernel_system> kern_guard(*kern, std::try_to_lock)' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'bool try_lock() {' upstream/src/emu/kernel/include/kernel/kernel.h
          grep -Fq 'return kern_lock_.try_lock();' upstream/src/emu/kernel/include/kernel/kernel.h
          grep -Fq 'return true;' upstream/src/emu/dispatch/src/audio.cpp
          grep -Fq 'V14 DSP REFILL:' upstream/src/emu/drivers/src/audio/backend/dsp_shared.cpp
          grep -Fq 'V14 MMF95 PLAYDATA:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V13 MMF95 ABI112:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V12 MMF95 PRIORITY: opcode=45 dispatch' upstream/src/emu/services/src/audio/mmf/dev.cpp
          echo 'V15 FIXED2 source markers: PASS'

      - name: Install V16 MMF95 queue-delivery retry fix
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_09.py"

      - name: Verify V16 source markers
        run: |
          set -euo pipefail
          grep -Fq 'V16 MMF95 QRETRY: BufferToBeFilled event queue full; retry later' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'return evt_msg_queue_->send(&item, sizeof(epoc::mmf_dev_sound_queue_item));' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'bool do_report_buffer_to_be_filled();' upstream/src/emu/services/include/services/audio/mmf/dev.h
          grep -Fq 'V15 DSP RETRY:' upstream/src/emu/drivers/src/audio/backend/dsp_shared.cpp
          grep -Fq 'V15 MMF95 RETRY: playback kernel busy' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V14 MMF95 PLAYDATA:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          echo 'V16 source markers: PASS'


      - name: Install V17 FIXED3 semantic msg_queue ordering fix
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_10.py"

      - name: Verify V17 FIXED3 source and preserved V9-V16 chain
        run: |
          set -euo pipefail
          FILE=upstream/src/emu/kernel/src/msgqueue.cpp

          grep -Fq '#include <common/log.h>' "$FILE"
          grep -Fq 'V17 MSGQ ORDER: data queued before availability notification' "$FILE"
          grep -Fq 'const bool was_empty = msgs_.empty();' "$FILE"
          grep -Fq 'const bool had_available_waiter' "$FILE"

          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_11.py"

          grep -Fq 'V16 MMF95 QRETRY:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'return evt_msg_queue_->send(&item, sizeof(epoc::mmf_dev_sound_queue_item));' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V15 DSP RETRY:' upstream/src/emu/drivers/src/audio/backend/dsp_shared.cpp
          grep -Fq 'V15 MMF95 RETRY: playback kernel busy' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V14 MMF95 PLAYDATA:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V13 MMF95 ABI112:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V12 MMF95 PRIORITY: opcode=45 dispatch' upstream/src/emu/services/src/audio/mmf/dev.cpp

          echo 'V17 FIXED3 source + V9-V16 preservation: PASS'


      - name: Install V18 MMF event-consumer latency diagnostics
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_12.py"

      - name: Verify V18 diagnostics and preserved V9-V17 chain
        run: |
          set -euo pipefail
          MSGQ=upstream/src/emu/kernel/src/msgqueue.cpp
          DEV=upstream/src/emu/services/src/audio/mmf/dev.cpp

          grep -Fq 'V18 MSGQ40 ARM:' "$MSGQ"
          grep -Fq 'V18 MSGQ40 WAKE-BEFORE:' "$MSGQ"
          grep -Fq 'V18 MSGQ40 WAKE-AFTER:' "$MSGQ"
          grep -Fq 'V18 MSGQ40 RECV:' "$MSGQ"
          grep -Fq 'V18 MMF95 EVTSEND:' "$DEV"

          grep -Fq 'V17 MSGQ ORDER:' "$MSGQ"
          grep -Fq 'V16 MMF95 QRETRY:' "$DEV"
          grep -Fq 'V15 DSP RETRY:' upstream/src/emu/drivers/src/audio/backend/dsp_shared.cpp
          grep -Fq 'V15 MMF95 RETRY: playback kernel busy' "$DEV"
          grep -Fq 'V14 MMF95 PLAYDATA:' "$DEV"
          grep -Fq 'V13 MMF95 ABI112:' "$DEV"
          grep -Fq 'V12 MMF95 PRIORITY: opcode=45 dispatch' "$DEV"

          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_13.py"

          echo 'V18 diagnostics + V9-V17 preservation: PASS'


      - name: Install V19 FIXED1 Dyncom cross-thread atomic stop fix
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_14.py"

      - name: Verify V19 FIXED1 source and preserved V9-V18 chain
        run: |
          set -euo pipefail
          STATE=upstream/src/emu/cpu/include/cpu/dyncom/armstate.h
          CORE=upstream/src/emu/cpu/src/dyncom/arm_dyncom.cpp
          INTERP=upstream/src/emu/cpu/src/dyncom/arm_dyncom_interpreter.cpp

          grep -Fq '#include <atomic>' "$STATE"
          grep -Fq 'std::atomic<std::uint64_t> NumInstrsToExecute{0};' "$STATE"
          grep -Fq 'V19 DYNCOM ATOMICSTOP: atomic instruction budget enabled' "$CORE"

          grep -Fq 'NumInstrsToExecute.store(0, std::memory_order_relaxed)' "$CORE"
          grep -Fq 'NumInstrsToExecute.load(std::memory_order_relaxed) != 1' "$INTERP"

          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_15.py"

          grep -Fq 'V18 MSGQ40 WAKE-AFTER:' upstream/src/emu/kernel/src/msgqueue.cpp
          grep -Fq 'V18 MSGQ40 RECV:' upstream/src/emu/kernel/src/msgqueue.cpp
          grep -Fq 'V18 MMF95 EVTSEND:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V17 MSGQ ORDER:' upstream/src/emu/kernel/src/msgqueue.cpp
          grep -Fq 'V16 MMF95 QRETRY:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V15 DSP RETRY:' upstream/src/emu/drivers/src/audio/backend/dsp_shared.cpp
          grep -Fq 'V14 MMF95 PLAYDATA:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V13 MMF95 ABI112:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V12 MMF95 PRIORITY: opcode=45 dispatch' upstream/src/emu/services/src/audio/mmf/dev.cpp

          echo 'V19 FIXED1 atomic stop + V9-V18 preservation: PASS'


      - name: Install V20 run-loop reschedule diagnostics
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_16.py"

      - name: Verify V20 source and preserved V9-V19 chain
        run: |
          set -euo pipefail
          KH=upstream/src/emu/kernel/include/kernel/kernel.h
          KC=upstream/src/emu/kernel/src/kernel.cpp
          MQ=upstream/src/emu/kernel/src/msgqueue.cpp

          grep -Fq 'v20_audio_wake_seq_' "$KH"
          grep -Fq 'void v20_mark_audio_wake(kernel::thread *requester);' "$KH"
          grep -Fq 'V20 AUDIOWAKE:' "$KC"
          grep -Fq 'V20 RESCHED BEGIN:' "$KC"
          grep -Fq 'V20 RESCHED END:' "$KC"
          grep -Fq 'kern->v20_mark_audio_wake(notify.requester);' "$MQ"

          grep -Fq 'V19 DYNCOM ATOMICSTOP:' upstream/src/emu/cpu/src/dyncom/arm_dyncom.cpp
          grep -Fq 'V18 MSGQ40 WAKE-AFTER:' "$MQ"
          grep -Fq 'V18 MSGQ40 RECV:' "$MQ"
          grep -Fq 'V18 MMF95 EVTSEND:' upstream/src/emu/services/src/audio/mmf/dev.cpp
          grep -Fq 'V17 MSGQ ORDER:' "$MQ"
