          grep -Fq 'NGAGE CLASSIC R2A FINAL1:' upstream/src/emu/ios/src/launcher.cpp
          git -C upstream diff --check
          echo 'R2FX2 COMPATIBILITY R1 source preflight: PASS'

      - name: Install R2FX2 COMPATIBILITY R2 EXPORTMAP BATCH1 target classifier
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/eka2l1-ngage-support/blobs/blob_07_NGAGE_CLASSIC_R2FX2_COMPATIBILITY_R2_EXPORTMAP_BATCH1_PATCH.py" "$RUNNER_TEMP/NGAGE_CLASSIC_R2FX2_COMPATIBILITY_R2_EXPORTMAP_BATCH1_PATCH.py"
          echo "aaa238b00d755635bb16774e1b9f6446173c0e8d8d2d10f76c50891fe2f17411  $RUNNER_TEMP/NGAGE_CLASSIC_R2FX2_COMPATIBILITY_R2_EXPORTMAP_BATCH1_PATCH.py" | shasum -a 256 -c -
          python3 "$RUNNER_TEMP/NGAGE_CLASSIC_R2FX2_COMPATIBILITY_R2_EXPORTMAP_BATCH1_PATCH.py"
          grep -Fq 'NGAGE CLASSIC R2FX2 COMPATIBILITY R2 EXPORTMAP BATCH1:' upstream/src/emu/kernel/src/codeseg.cpp
          grep -Fq 'export-map target ordinal=' upstream/src/emu/kernel/src/codeseg.cpp
          grep -Fq 'exact symbol/ABI required before HLE' upstream/src/emu/kernel/src/codeseg.cpp
          grep -Fq 'deferred known import ordinal=' upstream/src/emu/kernel/src/codeseg.cpp
          grep -Fq 'unresolved NEW guest ordinal=' upstream/src/emu/kernel/src/codeseg.cpp
          ! grep -Fq 'known EKA1 version-skew import ordinal=' upstream/src/emu/kernel/src/codeseg.cpp
          grep -Fq 'NGAGE CLASSIC R2FX1 CLEANUP:' upstream/src/emu/system/src/devices.cpp
          grep -Fq 'NGAGE CLASSIC R2B MULTIFIRMWARE R2:' upstream/src/emu/system/src/devices.cpp
          grep -Fq 'NGAGE CLASSIC R2A FINAL1:' upstream/src/emu/ios/src/launcher.cpp
          git -C upstream diff --check
          echo 'R2FX2 COMPATIBILITY R2 EXPORTMAP BATCH1 source preflight: PASS'


      - name: Install R2FX2 R2 CRASHFIX1 SUPPORT1 lifecycle patch
        run: |
          set -euo pipefail
          PATCH="$RUNNER_TEMP/eka2l1-ngage-support/payload/NGAGE_CLASSIC_R2FX2_R2_CRASHFIX1_PATCH.py"
          echo "ddef28a5472cb2039d39ecf6f5adbff72da23aa7c60010635a89d0b7c021240a  $PATCH" | shasum -a 256 -c -
          python3 -m py_compile "$PATCH"
          python3 "$PATCH"

          ROOT=upstream/src/emu/ios/app/RootViewController.mm
          grep -Fq 'NGAGE CLASSIC R2FX2 R2 CRASHFIX1:' "$ROOT"
          grep -Fq 'com.eka2l1.ngage.lifecycle' "$ROOT"
          test "$(grep -Fc 'dispatch_async(EKANgageLifecycleQueue(), ^{' "$ROOT")" -eq 2
          grep -Fq 'menu-touch enter gameRunning=' "$ROOT"
          grep -Fq 'menu-controller marshal-main' "$ROOT"
          grep -Fq 'exit bridge-call' "$ROOT"
          grep -Fq 'exit bridge-return' "$ROOT"
          grep -Fq 'device-switch bridge-call' "$ROOT"
          grep -Fq 'device-switch bridge-return' "$ROOT"
          grep -Fq 'NGAGE CLASSIC R2FX2 COMPATIBILITY R2 EXPORTMAP BATCH1:' upstream/src/emu/kernel/src/codeseg.cpp
          grep -Fq 'unresolved NEW guest ordinal=' upstream/src/emu/kernel/src/codeseg.cpp
          ! grep -Fq 'ord == 61' upstream/src/emu/kernel/src/codeseg.cpp
          ! grep -Fq 'ord == 63' upstream/src/emu/kernel/src/codeseg.cpp
          git -C upstream diff --check
          echo 'R2FX2 R2 CRASHFIX1 SUPPORT1 source preflight: PASS'

      - name: Verify N-Gage Classic R1 source integration
        run: |
          set -euo pipefail
          ROM=upstream/src/emu/ios/ngage/SYM.ROM
          ROOT=upstream/src/emu/ios/app/RootViewController.mm
          LOC=upstream/src/emu/ios/app/EKALocalization.mm
          CMAKE=upstream/src/emu/ios/CMakeLists.txt
          test -f "$ROM"
          test "$(stat -f %z "$ROM")" = "18612224"
          echo "afc1cc8b693f2b68d23ca203aa4d4eb4266baad4ab718f013a33b915d39574ef  $ROM" | shasum -a 256 -c -
          grep -Fq 'NGAGE CLASSIC R1:' "$ROOT"
          grep -Fq 'showAddModeMenu' "$ROOT"
          grep -Fq 'activateBundledNGageMode' "$ROOT"
          grep -Fq 'installBundledNGageMode' "$ROOT"
          grep -Fq 'assets/ngage/SYM.ROM' "$ROOT"
          grep -Fq 'firmware == "NEM-4"' "$ROOT"
          grep -Fq 'EKAL(@"Add Mode")' "$ROOT"
          grep -Fq '@"Add Mode" : @"Thêm chế độ"' "$LOC"
          grep -Fq 'ngage/SYM.ROM' "$CMAKE"
          git -C upstream diff --check
          echo 'N-Gage Classic R1 source integration: PASS'

      - name: Apply upstream iOS submodule patches
        working-directory: upstream
        run: |
          set -euo pipefail
          P="$PWD/.github/ios-build/patches"
          if [ -d "$P" ]; then
            git -C src/external/cubeb                     apply "$P/cubeb.patch"  || true
            git -C src/external/fmt                       apply "$P/fmt.patch"    || true
            git -C src/external/ffmpeg                    apply "$P/ffmpeg.patch" || true
            git -C src/external/dynarmic/externals/oaknut apply "$P/oaknut.patch" || true
            if [ -f .github/ios-build/ffmpeg/build-ios-device.sh ]; then
              cp .github/ios-build/ffmpeg/build-ios-device.sh src/external/ffmpeg/
              chmod +x src/external/ffmpeg/build-ios-device.sh
            fi
          fi

      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XC" ] || XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC/Contents/Developer"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Ninja
        run: brew install ninja

      - name: Install CMake 3.31.6
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/cmake.tar.gz" \
            https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
          tar xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cmake-3.31.6-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"

      - name: Build FFmpeg for iPhone if needed
        working-directory: upstream
        run: |
          set -euo pipefail
          if [ ! -f src/external/ffmpeg/macos/arm64-device/lib/libavcodec.a ]; then
            chmod +x src/external/ffmpeg/build-ios-device.sh
            (cd src/external/ffmpeg && ./build-ios-device.sh)
          else
            echo 'Using prebuilt FFmpeg device libraries.'
          fi

      - name: Install J2ME R1 phoneME interpreter on SUPPORT1
        run: |
          set -euo pipefail
          ASSET_ROOT="$RUNNER_TEMP/j2me-r1-assets/J2ME-R1-PHONEME-INTERPRETER-ASSETS"
          CORE="$ASSET_ROOT/phoneME/Core"
          UPSTREAM="$GITHUB_WORKSPACE/upstream"
          BUILD="$RUNNER_TEMP/phoneme-core-r1"
          STAGE="$UPSTREAM/third_party/phoneme-r1"

          # Keep the verified J2ME ZIP byte-for-byte. The legacy wrapper ends with
          # R3-specific guards, so run its build/verify/apply payload directly and
          # gate against the frozen SUPPORT1 baseline instead.
          rm -rf "$STAGE" "$BUILD"
          mkdir -p "$STAGE/lib" "$STAGE/include"
          PHONEME_CORE_BUILD_DIR="$BUILD"           PHONEME_CORE_OUTPUT="$STAGE/lib/libphoneMECore.a"           PHONEME_APPLE_SDK=iphoneos           IOS_DEPLOYMENT_TARGET=15.0           PHONEME_ENABLE_DECODED_EXECUTION=1           PHONEME_ENABLE_THINLTO=0             bash "$CORE/Tools/build-iphoneos.sh"
          PHONEME_CORE_BUILD_DIR="$BUILD"           PHONEME_CORE_OUTPUT="$STAGE/lib/libphoneMECore.a"           PHONEME_APPLE_SDK=iphoneos           IOS_DEPLOYMENT_TARGET=15.0           PHONEME_ENABLE_DECODED_EXECUTION=1           PHONEME_ENABLE_THINLTO=0             bash "$CORE/Tools/verify-iphoneos.sh"
          cp -R "$CORE/include/." "$STAGE/include/"
          python3 "$ASSET_ROOT/scripts/apply_j2me_r1.py" "$UPSTREAM"

          test -s "$STAGE/lib/libphoneMECore.a"
          grep -Fq '#define PHONEME_C_API_VERSION_MAJOR 1u' "$STAGE/include/PhoneMECore.h"
          grep -Fq '#define PHONEME_C_API_VERSION_MINOR 3u' "$STAGE/include/PhoneMECore.h"
          grep -Fq '#define PHONEME_C_API_VERSION_PATCH 0u' "$STAGE/include/PhoneMECore.h"
          grep -Fq 'J2ME R1 PHONEME INTERPRETER' "$UPSTREAM/src/emu/ios/CMakeLists.txt"
          grep -Fq 'onJavaJ2ME' "$UPSTREAM/src/emu/ios/app/RootViewController.mm"
          grep -Fq 'phoneme_configure_jit(g_runtime, 0)' "$UPSTREAM/src/emu/ios/app/j2me/J2MEBridge.mm"
          grep -Fq '{128,128}, {128,160}, {132,176}, {176,220}' "$UPSTREAM/src/emu/ios/app/j2me/J2MEProfile.hpp"
          grep -Fq '{240,320}, {352,416}, {640,360}, {800,480}' "$UPSTREAM/src/emu/ios/app/j2me/J2MEProfile.hpp"
          grep -Fq 'screen_width = std::clamp(screen_width, 1, 2048)' "$UPSTREAM/src/emu/ios/app/j2me/J2MEProfile.hpp"
          grep -Fq 'screen_height = std::clamp(screen_height, 1, 2048)' "$UPSTREAM/src/emu/ios/app/j2me/J2MEProfile.hpp"
          grep -Fq 'scale_percent = std::clamp(scale_percent, 10, 300)' "$UPSTREAM/src/emu/ios/app/j2me/J2MEProfile.hpp"
          ! grep -R -qE 'phoneme/(runtime|base)/|std::expected' "$UPSTREAM/src/emu/ios/app/j2me"

          # SUPPORT1 regression gates must still be present after the additive Java patch.
          ROOT="$UPSTREAM/src/emu/ios/app/RootViewController.mm"
          CODESEG="$UPSTREAM/src/emu/kernel/src/codeseg.cpp"
          grep -Fq 'NGAGE CLASSIC R2FX2 R2 CRASHFIX1:' "$ROOT"
          grep -Fq 'com.eka2l1.ngage.lifecycle' "$ROOT"
          test "$(grep -Fc 'dispatch_async(EKANgageLifecycleQueue(), ^{' "$ROOT")" -eq 2
          grep -Fq 'exit bridge-call' "$ROOT"
          grep -Fq 'exit bridge-return' "$ROOT"
          grep -Fq 'device-switch bridge-call' "$ROOT"
          grep -Fq 'device-switch bridge-return' "$ROOT"
          grep -Fq 'NGAGE CLASSIC R2FX2 COMPATIBILITY R2 EXPORTMAP BATCH1:' "$CODESEG"
          grep -Fq 'unresolved NEW guest ordinal=' "$CODESEG"
          ! grep -Fq 'ord == 61' "$CODESEG"
          ! grep -Fq 'ord == 63' "$CODESEG"
          git -C "$UPSTREAM" diff --check
          echo 'J2ME R1 phoneME interpreter + SUPPORT1 preservation: PASS'

      - name: Configure iPhone arm64 build with LIBUVFIX1
        working-directory: upstream
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
          : > "$LOG"
          test -f "$PWD/src/external/libuv/CMakeLists.txt"
          {
            echo "LIBUVFIX1: FETCH_LIBUV=ON"
            echo "LIBUVFIX1: FETCHCONTENT_SOURCE_DIR_LIBUV=$PWD/src/external/libuv"
            cmake -S . -B build-ios-device -G Ninja               -DCMAKE_SYSTEM_NAME=iOS               -DCMAKE_OSX_SYSROOT=iphoneos               -DCMAKE_OSX_ARCHITECTURES=arm64               -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0               -DCMAKE_BUILD_TYPE=Release               -DFETCH_LIBUV=ON               -DFETCHCONTENT_SOURCE_DIR_LIBUV="$PWD/src/external/libuv"
          } 2>&1 | tee -a "$LOG"
          grep -Fq 'FETCH_LIBUV' build-ios-device/CMakeCache.txt
          grep -Fq 'FETCHCONTENT_SOURCE_DIR_LIBUV' build-ios-device/CMakeCache.txt
          grep -Fq "$PWD/src/external/libuv" build-ios-device/CMakeCache.txt
          echo 'LIBUVFIX1 configure cache: PASS' | tee -a "$LOG"
      - name: Build EKA2L1 app serially
        working-directory: upstream
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/eka2l1-java-build.log"
          cmake --build build-ios-device --target eka2l1 -j1 2>&1 | tee -a "$LOG"
      - name: Verify N-Gage Classic R2B DEVICEPROFILES R1 and firmware
        working-directory: upstream
        run: |
          set -euo pipefail
          APP="build-ios-device/src/emu/ios/eka2l1.app"
          BIN="$APP/eka2l1"
          ROM="$APP/assets/ngage/SYM.ROM"
          test -x "$BIN"
          test -f "$ROM"
          test "$(stat -f %z "$ROM")" = "18612224"
          echo "afc1cc8b693f2b68d23ca203aa4d4eb4266baad4ab718f013a33b915d39574ef  $ROM" | shasum -a 256 -c -

          # Do not use POSIX `strings` for Objective-C UI literals.
          # NSString/CFString constants containing characters such as U+2026
          # (the ellipsis in "Symbian Device…") or Vietnamese text may be
          # emitted as UTF-16, making even their ASCII-looking prefix invisible
          # to `strings`. Search the raw Mach-O bytes in all relevant encodings.
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_23.py"

          echo 'N-Gage Classic R2FX2 R2 CRASHFIX1 + EXPORTMAP + R2FX1/R2B/R2A markers: PASS'

      - name: Verify V23 Vietnamese UI FIXED2 binary markers
        working-directory: upstream
        run: |
          set -euo pipefail
          BIN="build-ios-device/src/emu/ios/eka2l1.app/eka2l1"
          test -x "$BIN"
          STRINGS_OUT="$RUNNER_TEMP/eka2l1-v23-vi-fixed2-binary.strings"
          strings "$BIN" > "$STRINGS_OUT"
          markers=(
            'V23 VI18N:'
            'App Language'
            'Follow System'
            'Nokia/Symbian Language'
            'V23 IOS PERFQOS:'
            'V22 AUDIORECV:'
            'V22 AUDIOPATH SUMMARY:'
            'V22 AUDIOPATH OVERLAP:'
            'V21 CPUSLICE:'
            'V20 AUDIOWAKE:'
            'V20 RESCHED BEGIN:'
            'V20 RESCHED END:'
            'V19 DYNCOM ATOMICSTOP:'
            'V18 MMF95 EVTSEND:'
            'V18 MSGQ40 ARM:'
            'V18 MSGQ40 WAKE-BEFORE:'
            'V18 MSGQ40 WAKE-AFTER:'
            'V18 MSGQ40 RECV:'
            'V17 MSGQ ORDER:'
            'V16 MMF95 QRETRY:'
            'V15 DSP RETRY:'
            'V15 MMF95 RETRY:'
            'V14 DSP REFILL:'
            'V14 MMF95 STREAMINIT:'
            'V14 MMF95 FORMAT:'
            'V14 MMF95 CONFIGBUF:'
            'V14 MMF95 GETBUF:'
            'V14 MMF95 PLAYDATA:'
            'V13 MMF95 PRIORITYABI:'
            'V13 MMF95 CONFIG:'
            'V13 MMF95 ABI112:'
            'V13 MMF95 PLAYINIT:'
            'V12 MMF95 PRIORITY: opcode=45 dispatch'
            'V11 AKNICON95 RASTER:'
            'V11 CONTENTDIM PRECOMPLETE:'
            'V11 CONTENTDIM POSTCOMPLETE:'
            'V11 FBS95 FONT: layout=v2'
            'V11 LEAVE5:'
            'V10 AKNICON95 CONTENTDIM:'
            'V10 IPCERR:'
            'V9 FBS95 CREATE:'
            'V8 IPCCTX:'
            'V8 ALF95:'
            'V8 ALF95 COMPAT:'
            'V8 ALF95 IPCMISS:'
            'V7 AKNICON95:'
            'V7 OPENVG95 COVERAGE:'
            'V6 OPENVG95:'
            'V5 SVC95:'
            'V5 SVCMISS:'
            'V5 CODEDUMP: reentrancy guard enabled'
            'V3 EPOC95:'
            'V3 ROMBSS:'
          )
          for marker in "${markers[@]}"; do
            if grep -Fq "$marker" "$STRINGS_OUT"; then
              echo "PASS: $marker"
            else
              echo "ERROR: missing binary marker: $marker" >&2
              exit 1
            fi
          done
          python3 "$RUNNER_TEMP/eka2l1-ngage-support/scripts/pycode_24.py"
          echo 'V23 Vietnamese UI binary markers + V9-V23 preservation: PASS'

      - name: Verify J2ME R1 phoneME binary and SUPPORT1 isolation
        working-directory: upstream
        run: |
          set -euo pipefail
          APP="build-ios-device/src/emu/ios/eka2l1.app"
          BIN="$APP/eka2l1"
          ROOT="src/emu/ios/app/RootViewController.mm"
          CODESEG="src/emu/kernel/src/codeseg.cpp"
          test -x "$BIN"
          test -s third_party/phoneme-r1/lib/libphoneMECore.a
          strings "$BIN" | grep -Fq 'Java J2ME'
          strings "$BIN" | grep -Fq 'phoneME C ABI major mismatch'
          strings "$BIN" | grep -Fq 'MIDlet-1 is missing or invalid'
          grep -Fq 'phoneme_configure_jit(g_runtime, 0)' src/emu/ios/app/j2me/J2MEBridge.mm
          grep -Fq 'scale_percent = std::clamp(scale_percent, 10, 300)' src/emu/ios/app/j2me/J2MEProfile.hpp
          grep -Fq 'NGAGE CLASSIC R2FX2 R2 CRASHFIX1:' "$ROOT"
          grep -Fq 'com.eka2l1.ngage.lifecycle' "$ROOT"
          grep -Fq 'NGAGE CLASSIC R2FX2 COMPATIBILITY R2 EXPORTMAP BATCH1:' "$CODESEG"
          grep -Fq 'unresolved NEW guest ordinal=' "$CODESEG"
          ! grep -Fq 'ord == 61' "$CODESEG"
          ! grep -Fq 'ord == 63' "$CODESEG"
          echo 'J2ME R1 binary markers + SUPPORT1 isolation: PASS'

      - name: Package unsigned IPA
        working-directory: upstream
        run: |
          set -euo pipefail
          APP="build-ios-device/src/emu/ios/eka2l1.app"
          IPA="EKA2L1-iOS-JAVA-R1-PHONEME-SUPPORT1-LIBUVFIX1-unsigned.ipa"
          test -d "$APP"
          rm -rf ipa-stage "$IPA"
          mkdir -p ipa-stage/Payload
          cp -R "$APP" ipa-stage/Payload/EKA2L1.app
          rm -rf ipa-stage/Payload/EKA2L1.app/_CodeSignature
          rm -f ipa-stage/Payload/EKA2L1.app/embedded.mobileprovision
          (cd ipa-stage && /usr/bin/zip -qry "../$IPA" Payload)
          /usr/bin/unzip -t "$IPA" >/dev/null
          ls -lh "$IPA"
          shasum -a 256 "$IPA"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EKA2L1-iOS-JAVA-R1-PHONEME-SUPPORT1-LIBUVFIX1-IPA
          path: upstream/EKA2L1-iOS-JAVA-R1-PHONEME-SUPPORT1-LIBUVFIX1-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EKA2L1-JAVA-R1-PHONEME-SUPPORT1-LIBUVFIX1-build-log
          path: eka2l1-java-build.log
          if-no-files-found: ignore
          retention-days: 14
